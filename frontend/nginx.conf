# nginx.conf — alternative to server.js for static hosting without OG meta injection.
# Use this if you don't need per-subdomain branding and prefer a simpler stack.
# To switch: replace server.js with nginx in the Dockerfile.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # CSP (F11) — mirrors frontend/server.js's header. This static path has no
    # access to VITE_API_BASE_URL/VITE_WS_URL at request time, so fill in your
    # deployment's actual API/WS origins here before using nginx in production.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.example.com wss://api.example.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets — content-addressed, cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes return index.html so React Router handles them.
    # Shell must revalidate every load (a stale shell references pruned hashes).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
