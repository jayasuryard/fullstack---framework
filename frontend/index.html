<!doctype html>
<html lang="en">
<head>
  <!-- Open Graph — replace placeholders before shipping -->
  <meta property="og:title"       content="__OG_TITLE__" />
  <meta property="og:description" content="__OG_DESCRIPTION__" />
  <meta property="og:image"       content="__OG_IMAGE__" />
  <meta property="og:url"         content="__OG_URL__" />
  <meta property="og:type"        content="website" />
  <meta name="twitter:card"       content="summary_large_image" />
  <meta name="twitter:title"      content="__OG_TITLE__" />
  <meta name="twitter:description" content="__OG_DESCRIPTION__" />
  <meta name="twitter:image"      content="__OG_IMAGE__" />

  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" id="dynamic-favicon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__OG_TITLE__</title>

  <!--
    Branding bootstrap. On the Express server (frontend/server.js) the
    __OG_*__ placeholders above are replaced per-subdomain before this script
    runs — it becomes a no-op. On static hosts (frontend/nginx.conf) the raw
    placeholders reach the browser; this script applies the default title and
    swaps the favicon for the product OG image. No flash: runs before React
    mounts. Multi-tenant API-driven branding lives in server.js (getBranding,
    wired via BRANDING_API_PATH env).
  -->
  <script>
    (function () {
      var title = document.title;
      if (title.indexOf('__OG_TITLE__') !== -1) {
        document.title = 'SaaS App';
      }
      var favicon = document.getElementById('dynamic-favicon');
      var ogImage = document.querySelector('meta[property="og:image"]');
      if (favicon && ogImage && ogImage.content && ogImage.content.indexOf('__OG_IMAGE__') === -1) {
        favicon.href = ogImage.content;
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
