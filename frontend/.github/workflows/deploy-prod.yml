# Deploy Frontend — PRODUCTION environment
# Triggered on push of a v* tag (e.g. v1.2.3).
#
# Before using: replace APP_NAME with your product name.
# Required secrets (under Production environment): AWS_ACCESS_KEY_PROD,
#   AWS_SECRET_ACCESS_KEY_PROD, PROD_VPS_HOST, PROD_VPS_SSH_KEY, ENVFILES

name: Deploy Frontend PROD

on:
  push:
    tags:
      - 'v*'

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: APP_NAME-web-prod   # ← replace APP_NAME

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: Production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "${{ secrets.ENVFILES }}" > .env

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPOSITORY .

      - name: Tag Docker Image
        run: |
          docker tag $ECR_REPOSITORY:latest \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          envs: ECR_REPOSITORY,REGISTRY

          script: |
            set -e

            IMAGE=$REGISTRY/$ECR_REPOSITORY:latest
            APP=APP_NAME-web-prod   # ← replace APP_NAME

            echo "Logging into ECR..."
            aws ecr get-login-password --region ap-south-1 \
              | docker login \
                --username AWS \
                --password-stdin \
                $REGISTRY

            echo "Pull latest image..."
            docker pull $IMAGE

            echo "Stopping old container..."
            docker stop ${APP} || true
            docker rm   ${APP} || true

            echo "Starting new container..."
            docker run -d \
              --name ${APP} \
              --restart always \
              -p 8080:80 \
              $IMAGE

            echo "✅ Frontend deployed successfully."
