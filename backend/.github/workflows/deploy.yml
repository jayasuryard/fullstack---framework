# Deploy API — DEV environment
# Triggered on push to deployment-dev branch.
# Blue-green deployment: starts a staged container, verifies 3 consecutive health checks,
# then swaps traffic. Rolls back automatically if health checks fail.
#
# Before using: replace APP_NAME with your product name.
# Required secrets: AWS_ACCESS_KEY, AWS_SECRET_KEY, VPS_HOST, VPS_SSH_KEY

name: Deploy API DEV

on:
  push:
    branches:
      - deployment-dev

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: APP_NAME-api   # ← replace APP_NAME

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY .

      - name: Tag Docker image
        run: |
          docker tag $ECR_REPOSITORY:latest \
          ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:dev

      - name: Push Docker image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:dev

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            ECR_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:dev
            APP=APP_NAME-api          # ← replace APP_NAME
            ENV_FILE=/home/ubuntu/apps/env/APP_NAME.env   # ← replace APP_NAME

            echo "Logging into ECR..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS \
            --password-stdin ${{ steps.login-ecr.outputs.registry }}

            echo "Pulling latest image..."
            docker pull $ECR_IMAGE

            echo "Creating backup of running container..."
            docker commit ${APP} ${{ env.ECR_REPOSITORY }}:backup || true

            echo "Starting staged container on temp port 4000..."
            docker rm -f ${APP}-new || true
            docker run -d \
              --name ${APP}-new \
              --restart always \
              -p 4000:3000 \
              --add-host=host.docker.internal:host-gateway \
              --env-file $ENV_FILE \
              $ECR_IMAGE

            echo "Waiting for app startup..."
            sleep 30

            SUCCESS=0

            for i in $(seq 1 36); do
              echo "Health check attempt: $i"

              if curl --retry 3 --retry-delay 2 -fs http://localhost:4000/health; then
                SUCCESS=$((SUCCESS+1))
              else
                SUCCESS=0
              fi

              echo "Consecutive successes: $SUCCESS"

              if [ "$SUCCESS" -ge 3 ]; then
                echo "Staged container is stable."
                break
              fi

              sleep 5
            done

            if [ "$SUCCESS" -ge 3 ]; then
              echo "Switching traffic..."

              docker stop ${APP} || true
              docker rm   ${APP} || true

              docker run -d \
                --name ${APP} \
                --restart always \
                -p 3000:3000 \
                --add-host=host.docker.internal:host-gateway \
                --env-file $ENV_FILE \
                $ECR_IMAGE

              docker rm -f ${APP}-new || true

              # Add seed/post-deploy scripts here, e.g.:
              # docker exec ${APP} node seed/seedConfig.js || true

              echo "✅ Deployment successful."

            else
              echo "❌ Health check failed. Rolling back..."
              docker logs ${APP}-new || true
              docker rm -f ${APP}-new || true
              echo "Old container kept alive."
              exit 1
            fi
