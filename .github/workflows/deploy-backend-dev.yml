# Deploy API — DEV environment
#
# Lives at repo ROOT .github/workflows/ (GitHub only auto-discovers workflows
# here — backend/.github/workflows/ and frontend/.github/workflows/ are not
# picked up at all in a single-repo layout).
#
# Gated on root CI (.github/workflows/ci.yml) passing for the `deployment-dev`
# branch via `workflow_run` — `needs:` can't cross workflow files, and folding
# the whole CI job matrix in here would duplicate ci.yml. workflow_run keeps
# ci.yml as the single source of truth and adds the least disruption.
#
# Images are tagged with both `dev` and the git SHA — the SHA tag is what
# actually gets deployed, so rollback is well-defined (redeploy a prior SHA).
#
# Blue-green: staged container on temp port 4000, migrations run as an
# explicit pre-traffic-switch step, then N consecutive /health/deep checks
# before traffic switches to port 3000. Failure leaves the old container
# running and fails the job loudly.
#
# Before using: replace APP_NAME with your product name.
# Required secrets: AWS_ACCESS_KEY, AWS_SECRET_KEY, VPS_HOST, VPS_SSH_KEY

name: Deploy API DEV

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [deployment-dev]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Git SHA to roll back to (previously built & pushed image tag). Skips build/push."
        required: false
        type: string

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: APP_NAME-api   # ← replace APP_NAME

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_sha || github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deploy SHA
        id: sha
        run: |
          if [ -n "${{ github.event.inputs.rollback_sha }}" ]; then
            echo "value=${{ github.event.inputs.rollback_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        if: github.event.inputs.rollback_sha == ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to ECR (rollback path)
        id: login-ecr-rollback
        if: github.event.inputs.rollback_sha != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        if: github.event.inputs.rollback_sha == ''
        working-directory: .
        run: |
          docker build -f backend/dockerfile -t $ECR_REPOSITORY ./backend

      - name: Tag Docker image (SHA + dev)
        if: github.event.inputs.rollback_sha == ''
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          docker tag $ECR_REPOSITORY:latest $REGISTRY/$ECR_REPOSITORY:${{ steps.sha.outputs.value }}
          docker tag $ECR_REPOSITORY:latest $REGISTRY/$ECR_REPOSITORY:dev

      - name: Push Docker image
        if: github.event.inputs.rollback_sha == ''
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          docker push $REGISTRY/$ECR_REPOSITORY:${{ steps.sha.outputs.value }}
          docker push $REGISTRY/$ECR_REPOSITORY:dev

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry || steps.login-ecr-rollback.outputs.registry }}
          DEPLOY_SHA: ${{ steps.sha.outputs.value }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ECR_REPOSITORY,REGISTRY,DEPLOY_SHA
          script: |
            set -e

            ECR_IMAGE=$REGISTRY/$ECR_REPOSITORY:$DEPLOY_SHA
            APP=APP_NAME-api          # ← replace APP_NAME
            ENV_FILE=/home/ubuntu/apps/env/APP_NAME.env   # ← replace APP_NAME

            echo "Logging into ECR..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS \
            --password-stdin $REGISTRY

            echo "Pulling image $ECR_IMAGE ..."
            docker pull $ECR_IMAGE

            echo "Creating backup of running container..."
            docker commit ${APP} ${ECR_REPOSITORY}:backup || true

            # --- Explicit, separately-gated migration step -------------------
            # Runs against the target DB using the image about to be deployed,
            # BEFORE any container starts serving traffic. A failure here stops
            # the job (set -e) and leaves the current production container
            # completely untouched.
            echo "Running database migrations (gated — failure halts deploy)..."
            docker run --rm \
              --env-file $ENV_FILE \
              --add-host=host.docker.internal:host-gateway \
              $ECR_IMAGE \
              npx prisma migrate deploy
            # -------------------------------------------------------------------

            echo "Starting staged container on temp port 4000..."
            docker rm -f ${APP}-new || true
            docker run -d \
              --name ${APP}-new \
              --restart always \
              -p 4000:3000 \
              --add-host=host.docker.internal:host-gateway \
              --env-file $ENV_FILE \
              $ECR_IMAGE

            echo "Waiting for app startup..."
            sleep 30

            SUCCESS=0

            for i in $(seq 1 36); do
              echo "Health check attempt: $i"

              if curl --retry 3 --retry-delay 2 -fs http://localhost:4000/health/deep; then
                SUCCESS=$((SUCCESS+1))
              else
                SUCCESS=0
              fi

              echo "Consecutive successes: $SUCCESS"

              if [ "$SUCCESS" -ge 3 ]; then
                echo "Staged container is stable."
                break
              fi

              sleep 5
            done

            if [ "$SUCCESS" -ge 3 ]; then
              echo "Switching traffic..."

              docker stop ${APP} || true
              docker rm   ${APP} || true

              docker run -d \
                --name ${APP} \
                --restart always \
                -p 3000:3000 \
                --add-host=host.docker.internal:host-gateway \
                --env-file $ENV_FILE \
                $ECR_IMAGE

              docker rm -f ${APP}-new || true

              # Add seed/post-deploy scripts here, e.g.:
              # docker exec ${APP} node seed/seedConfig.js || true

              echo "Deployed $DEPLOY_SHA successfully."

            else
              echo "Health check failed. Rolling back..."
              docker logs ${APP}-new || true
              docker rm -f ${APP}-new || true
              echo "Old container kept alive."
              exit 1
            fi
